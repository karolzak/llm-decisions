# R15 decision corpus: the R9 choice mix plus score and noul (yes/no) rows, so all three
# question types of the decision APIs are trained (docs/replication.md, F15).
# R9 mix: 2-100 options per row (read in one pass with code labels). ACE, BANKING77 and SST-5
# (used by R14) are excluded.
# Caveat: CLINC150 and MASSIVE contain banking/finance intents (similar domain to BANKING77).
name: decision-mix-r15
description: R9's eleven choice tasks plus 2 score and 4 noul sources.
rows_per_source: 3000
max_options: 100
min_options: 2
subsample: true      # vary the option-set size for every source
max_state_chars: 3000
holdout_fraction: 0.05
seed: 0
sources:
  - name: ag_news
    dataset: fancyzhx/ag_news
    state: "{text}"
    label: label
    instructions:
      - What is the topic of this news article?
      - Which news section does this article belong to?
    rename: {Sci/Tech: Science and technology}
  - name: dbpedia
    dataset: fancyzhx/dbpedia_14
    config: dbpedia_14
    state: "{title}: {content}"
    label: label
    instructions:
      - What kind of entity does this encyclopedia entry describe?
      - Which category fits the subject of this text?
  - name: yahoo_topics
    dataset: community-datasets/yahoo_answers_topics
    config: yahoo_answers_topics
    state: "{question_title}\n{question_content}"
    label: topic
    instructions:
      - Which forum category should this question be posted in?
      - What is this question about?
  - name: emotion
    dataset: dair-ai/emotion
    config: split
    state: "{text}"
    label: label
    instructions:
      - Which emotion does the writer express?
      - How does the author of this message feel?
  - name: sst2
    dataset: nyu-mll/glue
    config: sst2
    state: "{sentence}"
    label: label
    instructions:
      - What is the sentiment of this movie review excerpt?
      - Is this review fragment positive or negative?
  - name: mnli
    dataset: nyu-mll/glue
    config: mnli
    state: "Premise: {premise}\nHypothesis: {hypothesis}"
    label: label
    instructions:
      - How does the hypothesis relate to the premise?
      - Given the premise, is the hypothesis true, false or undetermined?
    descriptions:
      entailment: The premise guarantees that the hypothesis is true.
      neutral: The premise neither guarantees nor rules out the hypothesis.
      contradiction: The premise rules out the hypothesis.
  - name: boolq
    dataset: google/boolq
    state: "{passage}"
    label: answer
    instructions:
      - "Based on the passage: {question}?"
      - "Answer from the passage only: {question}?"
    rename: {"true": "yes", "false": "no"}
  - name: clinc
    dataset: clinc/clinc_oos
    config: plus
    state: "{text}"
    label: intent
    instructions:
      - What does the user want the assistant to do?
      - Which intent does this request express?
    rename: {oos: out_of_scope}
    rows: 4000
    note: Includes banking intents; a similar domain to BANKING77 (different data).
  - name: massive
    dataset: mteb/amazon_massive_intent
    config: en
    state: "{text}"
    label: label_text
    rows: 4000
    instructions:
      - What does the user want the assistant to do?
      - Which intent does this request express?
      - Route this request to the right intent.
  - name: dbpedia_l3
    dataset: DeveloperOats/DBPedia_Classes
    state: "{text}"
    label: l3
    rows: 4000
    instructions:
      - What kind of entity does this encyclopedia entry describe?
      - Which fine-grained category fits the subject of this text?
  - name: newsgroups
    dataset: SetFit/20_newsgroups
    state: "{text}"
    label: label_text
    instructions:
      - Which newsgroup was this message posted to?
      - What is the topic of this forum message?
  # ---------------------------------------------------------------- score (levels lowest first)
  - name: yelp_score
    type: score
    dataset: Yelp/yelp_review_full
    config: yelp_review_full
    state: "{text}"
    label: label
    instructions:
      - How would the reviewer rate this business?
      - How positive is this review?
      - How satisfied is the customer?
    levels:
      - [1 star, 2 stars, 3 stars, 4 stars, 5 stars]
      - [very negative, negative, mixed, positive, very positive]
      - [terrible, poor, average, good, excellent]
  - name: stsb_score
    type: score
    dataset: nyu-mll/glue
    config: stsb
    state: "Sentence 1: {sentence1}\nSentence 2: {sentence2}"
    label: label
    round_label: true
    instructions:
      - How similar in meaning are the two sentences?
      - Rate the semantic similarity of the two sentences.
    levels:
      - [completely different, different but on the same topic, share some details, roughly equivalent with important differences, mostly equivalent, completely equivalent]
      - ["0", "1", "2", "3", "4", "5"]
  # ---------------------------------------------------------------- noul (yes/no)
  - name: boolq_noul
    type: noul
    dataset: google/boolq
    state: "{passage}"
    label: answer
    true_labels: ["true"]
    instructions:
      - "{question}?"
      - "According to the passage: {question}?"
  - name: mnli_noul
    type: noul
    dataset: nyu-mll/glue
    config: mnli
    state: "Premise: {premise}\nHypothesis: {hypothesis}"
    label: label
    true_labels: [entailment]
    instructions:
      - Does the premise imply that the hypothesis is true?
      - Is the hypothesis guaranteed by the premise?
    criteria:
      "true": The premise guarantees the hypothesis.
      "false": The premise does not guarantee the hypothesis (it contradicts it or leaves it open).
  - name: agnews_noul
    type: noul
    about: true
    dataset: fancyzhx/ag_news
    state: "{text}"
    label: label
    rename: {Sci/Tech: Science and technology}
    instructions:
      - "Is this news article about {label}?"
      - "Does this article belong in the {label} section?"
    criteria:
      "true": "The article is about {label}."
      "false": "The article is about something else."
  - name: emotion_noul
    type: noul
    about: true
    dataset: dair-ai/emotion
    config: split
    state: "{text}"
    label: label
    instructions:
      - "Does the writer express {label}?"
      - "Is the author of this message feeling {label}?"
