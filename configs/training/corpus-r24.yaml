# R24 decision corpus: the R9 mix plus synthetic many-domain routing data generated with GPT-6 Luna
# (scripts/synth_routing.py -> data/synthetic/r24/routing.jsonl): ~200 customer-facing domains, each
# with its own intent taxonomy; options come from the row's own domain, with intent descriptions on
# half of the rows. Banking / payments / lending, air travel and legal / compliance domains were
# excluded at generation time (they match BANKING77, MInDS-14, ATIS, ACE and ContractNLI).
# Caveat: CLINC150 and MASSIVE contain banking/finance intents (similar domain to BANKING77).
name: decision-mix-r24
description: R9's eleven choice tasks plus synthetic routing data from ~200 domains.
rows_per_source: 3000
max_options: 100
min_options: 2
subsample: true      # vary the option-set size for every source
max_state_chars: 3000
holdout_fraction: 0.05
seed: 0
sources:
  - name: ag_news
    dataset: fancyzhx/ag_news
    state: "{text}"
    label: label
    instructions:
      - What is the topic of this news article?
      - Which news section does this article belong to?
    rename: {Sci/Tech: Science and technology}
  - name: dbpedia
    dataset: fancyzhx/dbpedia_14
    config: dbpedia_14
    state: "{title}: {content}"
    label: label
    instructions:
      - What kind of entity does this encyclopedia entry describe?
      - Which category fits the subject of this text?
  - name: yahoo_topics
    dataset: community-datasets/yahoo_answers_topics
    config: yahoo_answers_topics
    state: "{question_title}\n{question_content}"
    label: topic
    instructions:
      - Which forum category should this question be posted in?
      - What is this question about?
  - name: emotion
    dataset: dair-ai/emotion
    config: split
    state: "{text}"
    label: label
    instructions:
      - Which emotion does the writer express?
      - How does the author of this message feel?
  - name: sst2
    dataset: nyu-mll/glue
    config: sst2
    state: "{sentence}"
    label: label
    instructions:
      - What is the sentiment of this movie review excerpt?
      - Is this review fragment positive or negative?
  - name: mnli
    dataset: nyu-mll/glue
    config: mnli
    state: "Premise: {premise}\nHypothesis: {hypothesis}"
    label: label
    instructions:
      - How does the hypothesis relate to the premise?
      - Given the premise, is the hypothesis true, false or undetermined?
    descriptions:
      entailment: The premise guarantees that the hypothesis is true.
      neutral: The premise neither guarantees nor rules out the hypothesis.
      contradiction: The premise rules out the hypothesis.
  - name: boolq
    dataset: google/boolq
    state: "{passage}"
    label: answer
    instructions:
      - "Based on the passage: {question}?"
      - "Answer from the passage only: {question}?"
    rename: {"true": "yes", "false": "no"}
  - name: clinc
    dataset: clinc/clinc_oos
    config: plus
    state: "{text}"
    label: intent
    instructions:
      - What does the user want the assistant to do?
      - Which intent does this request express?
    rename: {oos: out_of_scope}
    rows: 4000
    note: Includes banking intents; a similar domain to BANKING77 (different data).
  - name: massive
    dataset: mteb/amazon_massive_intent
    config: en
    state: "{text}"
    label: label_text
    rows: 4000
    instructions:
      - What does the user want the assistant to do?
      - Which intent does this request express?
      - Route this request to the right intent.
  - name: dbpedia_l3
    dataset: DeveloperOats/DBPedia_Classes
    state: "{text}"
    label: l3
    rows: 4000
    instructions:
      - What kind of entity does this encyclopedia entry describe?
      - Which fine-grained category fits the subject of this text?
  - name: newsgroups
    dataset: SetFit/20_newsgroups
    state: "{text}"
    label: label_text
    instructions:
      - Which newsgroup was this message posted to?
      - What is the topic of this forum message?
  # ---------------------------------------------------------------- synthetic routing (R24)
  - name: synth_routing
    dataset: local
    local: data/synthetic/r24/routing.jsonl
    state: "{text}"
    label: intent
    group: domain
    description_field: description
    describe_share: 0.5
    rows: 30000
    instructions:
      - "Route this message to the right team of the {group}."
      - What does the customer want?
      - Which intent does this message express?
      - "A customer of a {group} wrote this. Which request type is it?"
