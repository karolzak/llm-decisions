id: r17_routing
description: "R17: R9b-kl recipe + Bitext retail-banking and customer-support intents (BANKING77's domain, different data). ACE/BANKING77 not in training."
leaderboards: [replication]
supervision: zero_shot   # trained on other tasks only (configs/training/corpus-r17.yaml)
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_chat_readout
  model: qwen3.5-9b
  params:
    adapter: training/r17_routing   # under ARTIFACTS_DIR, written by scripts/train_decider.py
    readout: {labels: codes}
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
