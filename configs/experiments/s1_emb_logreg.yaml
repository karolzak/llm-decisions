id: s1_emb_logreg
description: "Bi-encoder: logistic-regression probe on state embeddings (fit on train)."
leaderboards: [product]
supervision: supervised   # fits on train-split labels
dataset: ace
label_catalogs: [short]
method:
  type: embedding
  model: text-embedding-3-large
  params:
    head: logreg
    views: state
    fit_split: train
run:
  concurrency: 8
  max_rpm: 240   # keep within your deployment's tokens/min limit (~1K tokens per ACE example)
