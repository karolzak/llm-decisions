id: r24_synth
description: "R24: candidate recipe + synthetic many-domain routing data (1,500 steps), byte-sorted options. ACE/BANKING77 not in training."
leaderboards: [replication]
supervision: zero_shot
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_chat_readout
  model: qwen3.5-9b
  params:
    adapter: training/r24_synth
    readout: {labels: codes, option_order: sorted}
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
