id: r15_typed
description: "R15: Qwen3.5-9B + LoRA trained on choice, score and noul questions (R9b recipe + typed rows, KL 1.0). ACE/BANKING77/SST-5 not in training."
leaderboards: [replication]
supervision: zero_shot   # trained on other tasks only (configs/training/corpus-r15.yaml)
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_chat_readout
  model: qwen3.5-9b
  params:
    adapter: training/r15_typed   # under ARTIFACTS_DIR, written by scripts/train_decider.py
    readout: {labels: codes, noul_style: truefalse, score_style: digits}
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
