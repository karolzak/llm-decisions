id: c5_oss_listwise_head
description: "gpt-oss-20b, listwise head on frozen option hidden states (trained on train, selected on dev)."
leaderboards: [controlled]
supervision: supervised
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_listwise_head
  model: gpt-oss-20b
  params:
    reasoning_effort: low
    layers: [8, 12, 16, 20, 24]
    features: [option, option_query]
    l2: [0.0001, 0.001, 0.01, 0.1, 1.0]
    fit_split: train
    select_split: dev
run:
  concurrency: 1      # one GPU, batch 1: latency = GPU time per decision
  timeout_s: 900
  max_retries: 1
