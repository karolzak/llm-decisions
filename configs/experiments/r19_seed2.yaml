id: r19_seed2
description: "R19 candidate recipe, seed 2, byte-sorted options. ACE/BANKING77 not in training."
leaderboards: [replication]
supervision: zero_shot
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_chat_readout
  model: qwen3.5-9b
  params:
    adapter: training/r19_seed2
    readout: {labels: codes, option_order: sorted}
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
