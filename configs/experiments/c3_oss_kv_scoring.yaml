id: c3_oss_kv_scoring
description: "gpt-oss-20b, candidate sequence likelihood with shared-prefix KV reuse (should equal C2)."
leaderboards: [product, controlled]
supervision: zero_shot
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_sequence_scoring
  model: gpt-oss-20b
  params:
    reasoning_effort: low
    kv_reuse: true
    length_norm: sum
run:
  concurrency: 1      # one GPU, batch 1: latency = GPU time per decision
  timeout_s: 900
  max_retries: 1
