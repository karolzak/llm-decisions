id: c6p_oss_letter_debiased
description: "gpt-oss-20b, option-letter readout averaged over cyclic option orderings with a content-free prior."
leaderboards: [product, controlled]
supervision: zero_shot
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_letter_readout
  model: gpt-oss-20b
  params:
    reasoning_effort: low
    rotations: all
    max_rotations: 4
    prior: content_free
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
