id: s1_embedding_centroid
description: Bi-encoder sanity baseline, cosine(state, class centroid of train embeddings).
leaderboards: [product]
dataset: ace
label_catalogs: [short]   # centroids do not depend on label text
method:
  type: embedding_similarity
  model: text-embedding-3-large
  params:
    mode: centroid
    fit_split: train
    tau: 0.05
run:
  concurrency: 8
enabled: false
notes: Needs an embedding deployment on kz-exp-foundry (configs/models/text-embedding-3-large.yaml).
