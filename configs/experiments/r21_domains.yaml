id: r21_domains
description: "R21: candidate recipe on many-domain routing data (corpus-r21), byte-sorted options. ACE/BANKING77 not in training."
leaderboards: [replication]
supervision: zero_shot
dataset: ace
label_catalogs: [short, verbose]
method:
  type: local_chat_readout
  model: qwen3.5-9b
  params:
    adapter: training/r21_domains
    readout: {labels: codes, option_order: sorted}
run:
  concurrency: 1
  timeout_s: 900
  max_retries: 1
