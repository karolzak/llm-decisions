id: s1_embedding_label
description: Bi-encoder sanity baseline, cosine(state, label text), zero-shot.
leaderboards: [product]
dataset: ace
label_catalogs: [short, verbose]
method:
  type: embedding_similarity
  model: text-embedding-3-large
  params:
    mode: label
    tau: 0.05
run:
  concurrency: 8
enabled: false
notes: Needs an embedding deployment on kz-exp-foundry (configs/models/text-embedding-3-large.yaml).
