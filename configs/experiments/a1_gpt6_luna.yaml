id: a1_gpt6_luna
description: GPT-6 Luna (Azure OpenAI), autoregressive label generation; one-hot probabilities.
leaderboards: [product]
dataset: ace
label_catalogs: [short, verbose]
method:
  type: azure_openai_autoregressive
  model: gpt-6-luna
  params:
    reasoning_effort: medium   # none|low|medium|high|xhigh (deployment default: medium)
    max_output_tokens: 4096
    confidence: none
    stream: true
run:
  concurrency: 8
  max_rpm: 240       # keep below your deployment's requests/min limit
